name: Keep Streamlit App Awake

# Streamlit Community Cloud puts apps to sleep after a period of inactivity,
# where "activity" means a real viewer session (a browser holding a WebSocket
# connection) — NOT a plain HTTP request. So this workflow drives a headless
# browser to actually visit the app, wake it if it's asleep, and hold the
# session briefly so the inactivity timer keeps resetting.

on:
  schedule:
    # Every 30 minutes. GitHub throttles/delays scheduled runs under load, but
    # since the sleep threshold is on the order of days, occasional real visits
    # are more than enough to keep the app awake.
    - cron: "*/30 * * * *"
  # Allow manual triggering from the Actions tab for testing.
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app to keep it awake
        run: python .github/scripts/keep_awake.py
